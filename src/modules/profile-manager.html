<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Manager</title>
    <link rel="stylesheet" href="../main.css">
    <script src="ProfileManager.js"></script>
</head>
<body>
    <header class="main">
        <h1>Profile Manager</h1>
        <p>Manage your CV profiles here.</p>
        <nav>
            <a href="main.html" class="btn btn-secondary">Back to Main Page</a>
        </nav>
    </header>

    <main>
        <section id="profile-list" class="features">
            <h2>Existing Profiles</h2>
            <div id="profiles-container" class="cards">
                <!-- Profile cards will be populated here -->
                <p>Loading profiles...</p>
            </div>
            <button onclick="createNewProfile()" class="btn btn-primary">Create New Profile</button>
        </section>

        <section id="profile-editor" class="features" style="display: none; margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
            <h2>Edit Profile</h2>
            <div id="profileForm">
                <!-- Profile form fields will be populated here -->
            </div>
            <button onclick="saveProfile()" class="btn btn-primary">Save Profile</button>
            <button onclick="cancelEdit()" class="btn btn-secondary">Cancel</button>
        </section>
    </main>

    <script>
        let currentProfileId = null;
        let allProfiles = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            loadProfiles();
        });

        // Create a new profile
        function createNewProfile() {
            currentProfileId = null;
            showProfileEditor({});
        }

        // Edit an existing profile
        async function editProfile(profileId) {
            try {
                // Load the actual profile data from database using module
                const { createProfileManager } = require('./src/modules');
                const userProfileManager = createProfileManager();
                const userId = 'sample-user';
                
                // Load the actual profile data from database
                const profileData = await userProfileManager.loadUserProfile(userId);
                currentProfileId = profileId;
                showProfileEditor(profileData);
            } catch (error) {
                console.error('Error editing profile:', error);
                alert('Error loading profile for editing.');
            }
        }

        // Show the profile editor with form fields
        function showProfileEditor(profileData) {
            const container = document.getElementById('profileForm');
            const editorSection = document.getElementById('profile-editor');
            // Populate the form fields with profile data from user database (or empty for new profile).
            // userData.name, userData.email, userData.mobile, userData.address
            container.innerHTML = `
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" value="${profileData.name || ''}">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" value="${profileData.email || ''}">
                </div>
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" value="${profileData.phone || ''}">
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" value="${profileData.address || ''}">
                </div>
                <div class="form-group">
                    <label for="summary">Summary:</label>
                    <textarea id="summary">${profileData.summary || ''}</textarea>
                </div>
            `;
            
            // Show the editor section
            document.getElementById('profile-list').style.display = 'none';
            editorSection.style.display = 'block';
        }

        // Save the current profile
        async function saveProfile() {
            console.log('Saving profile...');
            try {
                console.log('Saving profile try...');
                // Save to database using module
                const { UserProfileManager } = require('./src/modules');
                const userProfileManager = new UserProfileManager();
                
                const userId = 'sample-user';
                console.log('User ID for saving profile:', userId);
                // Collect form data
                const profileData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    mobile: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    profile_summary: document.getElementById('summary').value
                };
                
                // Save to database using the manager
                const success = await userProfileManager.saveUserProfile(userId, profileData);
                if (success) {
                    alert('Profile saved successfully!');
                    // Return to profile list view
                    cancelEdit();
                    loadProfiles(); // Reload profiles to show updated data
                } else {
                    alert('Error saving profile...');
                }
            } catch (error) {
                console.error('Error saving profile:', error);
                alert('Error saving profile', error);
            }
        }
        async function saveEducation(params) {
            console.log('Saving education...');
            try {
                console.log('Saving education try...');
                // Save to database using module
                const { UserProfileManager } = require('./src/modules');
                const userProfileManager = new UserProfileManager();
                
                const userId = 'sample-user';
                console.log('User ID for saving education:', userId);
                // Collect form data
                const educationData = {
                    degree: document.getElementById('degree').value,
                    institution: document.getElementById('institution').value,
                    year: document.getElementById('year').value
                };
                
                // Save to database using the manager
                const success = await userProfileManager.saveUserEducation(userId, educationData);
                if (success) {
                    alert('Education saved successfully!');
                    // Return to profile list view
                    cancelEdit();
                    loadProfiles(); // Reload profiles to show updated data
                } else {
                    alert('Error saving education...');
                }
            } catch (error) {
                console.error('Error saving education:', error);
                alert('Error saving education', error);
            }
        }
        async function saveExperience(params) {
            console.log('Saving experience...');
            try {
                console.log('Saving experience try...');
                // Save to database using module
                const { UserProfileManager } = require('./src/modules');
                const userProfileManager = new UserProfileManager();
                
                const userId = 'sample-user';
                console.log('User ID for saving experience:', userId);
                // Collect form data
                const experienceData = {
                    title: document.getElementById('title').value,
                    company: document.getElementById('company').value,
                    years: document.getElementById('years').value
                };
                
                // Save to database using the manager
                const success = await userProfileManager.saveUserExperience(userId, experienceData);
                if (success) {
                    alert('Experience saved successfully!');
                    // Return to profile list view
                    cancelEdit();
                    loadProfiles(); // Reload profiles to show updated data
                } else {
                    alert('Error saving experience...');
                }
            } catch (error) {
                console.error('Error saving experience:', error);
                alert('Error saving experience', error);
            }
        }
        async function saveSkills(params) {
            console.log('Saving skills...');
            try {
                console.log('Saving skills try...');
                // Save to database using module
                const { UserProfileManager } = require('./src/modules');
                const userProfileManager = new UserProfileManager();
                
                const userId = 'sample-user';
                console.log('User ID for saving skills:', userId);
                // Collect form data
                const skillsData = {
                    skills: document.getElementById('skills').value.split(',').map(skill => skill.trim())
                };
                
                // Save to database using the manager
                const success = await userProfileManager.saveUserSkills(userId, skillsData);
                if (success) {
                    alert('Skills saved successfully!');
                    // Return to profile list view
                    cancelEdit();
                    loadProfiles(); // Reload profiles to show updated data
                } else {
                    alert('Error saving skills...');
                }
            } catch (error) {
                console.error('Error saving skills:', error);
                alert('Error saving skills', error);
            }
        }
        
        

        // Cancel editing and return to profile list
        function cancelEdit() {
            document.getElementById('profile-list').style.display = 'block';
            document.getElementById('profile-editor').style.display = 'none';
        }

        // Delete a profile (simplified for demo)
        async function deleteProfile(profileId) {
            if (confirm('Are you sure you want to delete this profile?')) {
                try {
                    // In a real implementation, you'd remove from the profile manager
                    allProfiles = allProfiles.filter(p => p.id !== profileId);
                    displayProfiles();
                    alert('Profile deleted successfully.');
                } catch (error) {
                    console.error('Error deleting profile:', error);
                    alert('Error deleting profile');
                }
            }
        }
    </script>
</body>
</html>
